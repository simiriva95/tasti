name: Keep OMR service warm

# The Audiveris OMR service runs on Render's free tier, which sleeps after
# ~15 min idle (cold start ~40-60s on the next PDF). Ping its health endpoint
# every 10 min to keep it awake. GitHub delays scheduled runs under load, so
# treat this as best-effort warming, not a hard SLA.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          curl -fsS --max-time 90 https://tasti-o7xb.onrender.com/ \
            && echo "OMR service awake" \
            || echo "ping failed (service may be cold-starting)"
